<!doctype html>
<html><head><meta charset="utf-8">
<!--
SEASONAL video template (owner, 2026-10-21: "use autumn / Halloween colors sometimes, creative animations").
Pick the theme with the class on <body>:  class="autumn", "halloween", "blackfriday" (black + gold + VIP red, gold confetti)
or "holiday" (deep green + red + gold, falling snow),
"vice" (GTA 6-inspired Vice City sunset: magenta/pink -> orange, teal + purple neon, striped sun, palm silhouettes) or
"vicefriday" (GTA 6 neon x Black Friday: black night + neon pink/cyan + gold). Owner 2026-11-19. Use class .neo on headlines
(Anton condensed italic, sunset gradient fill + neon glow). Inspired look only: never the GTA/Rockstar name, logo or characters. Owner 2026-11-11: autumn is done; see RUNBOOK Design variety for dates.
Same 4-scene timing as the other templates (render 12.4s). Logo keeps its black pill; VIP red stays as an accent.
Copy to posts/YYYY-MM-DD/, set the logo path to ../../_kit/brand/logo_pill.jpg, edit the scene text.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
/* ---------- palettes ---------- */
body.autumn{--bg1:#3a1608;--bg2:#7a2e0c;--bg3:#c4561a;--ink:#fff8ef;--soft:#ffe1c2;--acc:#ffb347;--acc2:#d71928;--chip:#d71928}
body.halloween{--bg1:#0d0716;--bg2:#2a0f3d;--bg3:#4b1a5e;--ink:#fff;--soft:#e7d8f2;--acc:#ff7a1a;--acc2:#d71928;--chip:#ff7a1a}
body.blackfriday{--bg1:#000;--bg2:#0d0d0f;--bg3:#1c1407;--ink:#fff;--soft:#e9dcc0;--acc:#f5c542;--acc2:#d71928;--chip:#d71928}
body.holiday{--bg1:#06281a;--bg2:#0b3d27;--bg3:#7a0f18;--ink:#fffdf7;--soft:#e6f2ea;--acc:#f5c542;--acc2:#d71928;--chip:#d71928}
body.vice{--bg1:#1a0b3d;--bg2:#7a1d8f;--bg3:#ff5a7a;--ink:#fff;--soft:#ffe3f3;--acc:#2ef2e0;--acc2:#ff2e93;--chip:#ff2e93}
body.vicefriday{--bg1:#000;--bg2:#12051f;--bg3:#2a0838;--ink:#fff;--soft:#f5e6ff;--acc:#2ef2e0;--acc2:#ff2e93;--chip:#ff2e93}
body.vice{background:linear-gradient(180deg,#140833 0%,#4a1580 30%,#c2266f 62%,#ff7a3d 85%,#ffc061 100%)!important}
body.vicefriday{background:linear-gradient(180deg,#000 0%,#0b0418 45%,#2a0838 80%,#5a0d4a 100%)!important}
body.vice .sky,body.vicefriday .sky{background:radial-gradient(circle at 50% 78%,rgba(255,46,147,.35),transparent 55%)}
.sun{display:none;position:absolute;left:290px;top:1180px;width:500px;height:500px;border-radius:50%;background:linear-gradient(180deg,#ffe36b,#ff8a3d 50%,#ff2e93);
 -webkit-mask:repeating-linear-gradient(180deg,#000 0 34px,transparent 34px 44px);mask:repeating-linear-gradient(180deg,#000 0 34px,transparent 34px 44px);box-shadow:0 0 140px 40px rgba(255,46,147,.4);animation:rise 12.4s linear both}
body.vice .sun,body.vicefriday .sun{display:block}
body.vicefriday .sun{background:linear-gradient(180deg,#f5c542,#ff2e93 60%,#7a1d8f);opacity:.85}
.palms{display:none;position:absolute;left:0;right:0;bottom:0;height:760px;z-index:1;pointer-events:none}
body.vice .palms,body.vicefriday .palms{display:block}
.neo{display:inline-block;font-family:Anton,Impact,sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.01em;line-height:.95;
 background:linear-gradient(180deg,#fff 0%,#ffe36b 35%,#ff8a3d 60%,#ff2e93 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:3px #1a0b3d;filter:drop-shadow(0 0 18px rgba(255,46,147,.75)) drop-shadow(6px 8px 0 #1a0b3d)}
.neo.cyan{background:linear-gradient(180deg,#fff,#2ef2e0 60%,#1aa0ff);filter:drop-shadow(0 0 18px rgba(46,242,224,.75)) drop-shadow(6px 8px 0 #1a0b3d)}
body{background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);color:var(--ink)}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,180,90,.22),transparent 60%);animation:breathe 5s ease-in-out infinite alternate}
body.blackfriday .sky{background:radial-gradient(circle at 50% 30%,rgba(245,197,66,.18),transparent 60%)}
body.holiday .sky{background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.14),transparent 60%)}
body.halloween .sky{background:radial-gradient(circle at 50% 30%,rgba(255,122,26,.16),transparent 60%)}
@keyframes breathe{to{transform:scale(1.12)}}
/* moon (halloween only) */
.moon{display:none;position:absolute;right:90px;top:300px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6d8,#f3c86b 70%);box-shadow:0 0 120px 30px rgba(243,200,107,.35);animation:rise 12.4s linear both}
body.halloween .moon{display:block}
@keyframes rise{from{transform:translateY(80px)}to{transform:translateY(-40px)}}
/* falling leaves (autumn) / bats (halloween) */
.fx{position:absolute;inset:0;pointer-events:none;z-index:1}
.bat svg path{fill:#050208}
.bat{filter:drop-shadow(0 0 10px rgba(255,122,26,.55))}
.leaf{position:absolute;top:-120px;width:80px;height:80px;animation:fall linear infinite}
.leaf svg{width:100%;height:100%;animation:spin 2.6s ease-in-out infinite alternate}
@keyframes fall{to{transform:translate(var(--dx),2100px)}}
@keyframes spin{from{transform:rotate(-40deg)}to{transform:rotate(60deg)}}
.bat{display:none;position:absolute;width:120px;animation:fly linear infinite}
.bat svg{width:100%;animation:flap .35s ease-in-out infinite alternate;transform-origin:center}
@keyframes fly{from{transform:translate(-200px,0)}to{transform:translate(1300px,-260px)}}
@keyframes flap{to{transform:scaleY(.45)}}
body.halloween .leaf{display:none}
body.halloween .bat{display:block}
/* logo */
.logo{position:absolute;left:330px;top:110px;height:116px;width:420px;overflow:hidden;background:#0a0a0b;border-radius:58px;padding:10px 10px 0 10px;box-shadow:0 14px 34px rgba(0,0,0,.35);z-index:5}
.logo img{mix-blend-mode:lighten;width:100%;height:auto;margin:0;display:block}
.logo{display:flex!important;align-items:center;justify-content:center;padding:0 36px!important}
/* scenes: each one enters differently for variety */
.scene{position:absolute;left:80px;right:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;opacity:0;z-index:3}
@keyframes popin{0%{opacity:0;transform:scale(.6) rotate(-6deg)}10%{opacity:1;transform:scale(1.04) rotate(1deg)}16%{transform:none}88%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.1)}}
@keyframes slidein{0%{opacity:0;transform:translateX(700px)}10%{opacity:1;transform:none}88%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-700px)}}
@keyframes dropin{0%{opacity:0;transform:translateY(-500px)}9%{opacity:1;transform:translateY(20px)}14%{transform:none}88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(60px)}}
@keyframes inhold{0%{opacity:0;transform:scale(.9)}12%{opacity:1;transform:none}100%{opacity:1;transform:none}}
.s1{animation:popin 2.6s .2s both}
.s2{animation:slidein 2.8s 2.9s both}
.s3{animation:dropin 3s 5.8s both}
.s4{animation:inhold 3.4s 8.9s both}
/* type */
.big{font-size:146px;font-weight:900;line-height:.95;letter-spacing:-.035em;text-shadow:0 8px 30px rgba(0,0,0,.35)}
.acc{color:var(--acc)}
.red{color:var(--acc2)}
.sub{font-size:50px;color:var(--soft);margin-top:40px;font-weight:500;line-height:1.3}
.tag{display:inline-block;align-self:flex-start;background:var(--chip);color:#fff;font-weight:800;font-size:38px;letter-spacing:.1em;padding:14px 26px;border-radius:10px;text-transform:uppercase;margin-bottom:40px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.fine{font-size:30px;color:var(--soft);opacity:.75;margin-top:50px;line-height:1.4}
.list{font-size:60px;font-weight:800;line-height:1.35;letter-spacing:-.02em}
.ph{width:920px;height:620px;border-radius:36px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45);margin-bottom:50px;border:8px solid var(--acc)}
.ph img{width:100%;height:100%;object-fit:cover;animation:zoom 3s linear both}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
.s2 .ph img{animation-delay:2.9s}.s3 .ph img{animation-delay:5.8s}
.cta{font-size:90px;font-weight:900;line-height:1;text-align:center;letter-spacing:-.03em}
.info{text-align:center;margin-top:60px;font-size:44px;line-height:1.5;color:var(--soft)}
.info b{display:block;font-size:80px;color:#fff;font-weight:900;margin-bottom:10px;animation:pulsebig 1s ease-in-out 9.4s 3 alternate}
@keyframes pulsebig{to{transform:scale(1.07);color:var(--acc)}}
.walk{text-align:center;margin-top:40px;font-size:38px;font-weight:800;color:var(--acc);letter-spacing:.12em;text-transform:uppercase}
.bar{position:absolute;left:0;bottom:0;height:12px;background:var(--acc);animation:bar 12.3s linear forwards;z-index:6}
@keyframes bar{from{width:0}to{width:100%}}
</style></head><body class="autumn">
<div class="sky"></div>
<div class="sun"></div>
<svg class="palms" viewBox="0 0 1080 760" preserveAspectRatio="none"><g fill="#0c0420">
<path d="M120 760 C130 560 150 420 200 300 L212 304 C168 430 152 570 150 760Z"/>
<path d="M205 300 C150 250 70 250 10 290 C80 270 140 280 200 312Z M205 300 C190 230 130 180 60 180 C130 200 175 245 198 308Z M205 300 C250 230 320 210 390 230 C320 235 260 265 212 312Z M205 300 C270 280 340 300 380 360 C320 320 260 310 210 310Z M205 300 C215 230 260 180 300 160 C265 200 235 250 214 306Z"/>
<path d="M930 760 C915 600 900 470 860 360 L872 355 C915 470 935 600 960 760Z"/>
<path d="M866 358 C920 310 1000 310 1070 350 C1000 330 930 340 872 370Z M866 358 C880 290 940 240 1010 240 C940 260 895 305 874 366Z M866 358 C820 290 750 270 680 290 C750 295 810 325 860 370Z M866 358 C800 340 730 360 690 420 C750 380 810 370 862 368Z"/>
<rect x="0" y="720" width="1080" height="40"/></g></svg><div class="moon"></div>
<div class="fx" id="fx"></div>
<div class="logo"><img src="../brand/logo_pill.jpg"></div>

<div class="scene s1">
  <div class="tag">Columbus · Whitehall</div>
  <div class="big">Hook line<br>goes <span class="acc">here?</span></div>
  <div class="sub">Short friendly sub line. 🍂</div>
</div>

<div class="scene s2">
  <div class="ph"><img src="../photos/photo_06_new_iphones_in_box.jpg"></div>
  <div class="big" style="font-size:112px">Scene two<br><span class="acc">headline</span></div>
</div>

<div class="scene s3">
  <div class="list">Scene three point<br><span class="acc">in accent color.</span></div>
  <div class="sub">Supporting line.</div>
</div>

<div class="scene s4">
  <div class="cta">Call or<br><span class="acc">walk in</span></div>
  <div class="info"><b>380-271-8085</b>4257 E Main St, Whitehall<br>Open daily 10:30 AM – 8 PM</div>
  <div class="walk">Walk-ins welcome</div>
</div>
<div class="bar"></div>

<script>
// Deterministic leaves + bats (fixed positions/delays so every render is identical).
const fx=document.getElementById('fx');
const theme=document.body.className;
const leafColors=theme==='vice'?['#2ef2e0','#ff2e93','#ffe36b','#ffffff']:theme==='vicefriday'?['#f5c542','#ff2e93','#2ef2e0','#ffffff']:theme==='blackfriday'?['#f5c542','#ffe08a','#d71928','#ffffff','#c9a227']:theme==='holiday'?['#ffffff']:['#e8742a','#f2a33a','#c4401c','#a8541c','#f6c453'];
const confetti=c=>`<svg viewBox="0 0 100 100"><rect x="30" y="10" width="40" height="80" rx="6" fill="${c}"/></svg>`;
const snow=c=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="${c}" opacity=".9"/></svg>`;
const leafShape=c=>`<svg viewBox="0 0 100 100"><path d="M50 4 C70 20 92 30 90 55 C88 80 62 94 50 96 C38 94 12 80 10 55 C8 30 30 20 50 4Z" fill="${c}"/><path d="M50 10 L50 96 M50 40 L30 28 M50 40 L70 28 M50 62 L26 50 M50 62 L74 50" stroke="rgba(0,0,0,.25)" stroke-width="3" fill="none"/></svg>`;
for(let i=0;i<16;i++){
  const d=document.createElement('div');d.className='leaf';
  const x=(i*137)%1080, dur=6+(i%5), del=-((i*1.7)%dur), s=50+(i*23)%60;
  d.style.cssText=`left:${x}px;width:${s}px;height:${s}px;--dx:${(i%2?1:-1)*(120+(i*31)%160)}px;animation-duration:${dur}s;animation-delay:${del}s;opacity:${.55+(i%4)*.1}`;
  const c=leafColors[i%leafColors.length];d.innerHTML=(theme==='blackfriday'||theme.startsWith('vice'))?confetti(c):theme==='holiday'?snow(c):leafShape(c);fx.appendChild(d);
}
const bat=`<svg viewBox="0 0 120 50"><path d="M60 18 C55 8 50 10 48 16 C40 6 22 4 4 12 C16 16 22 24 22 34 C30 28 40 30 46 38 C50 30 56 30 60 36 C64 30 70 30 74 38 C80 30 90 28 98 34 C98 24 104 16 116 12 C98 4 80 6 72 16 C70 10 65 8 60 18Z" fill="#120818"/></svg>`;
for(let i=0;i<6;i++){
  const d=document.createElement('div');d.className='bat';
  const dur=5+(i%3)*1.5;
  d.style.cssText=`top:${380+i*230}px;width:${130+(i%3)*40}px;animation-duration:${dur}s;animation-delay:${-(i*1.3)}s`;
  d.innerHTML=bat;fx.appendChild(d);
}
</script>
</body></html>
