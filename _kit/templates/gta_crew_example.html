<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="gta_type.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{background:url(../photos/vice/vice_day2_1080x1920.jpg) center 70%/cover;font-family:Inter}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 40%,rgba(20,0,30,.45))}
.logo{position:absolute;left:330px;top:46px;height:100px;width:420px;overflow:hidden;background:#0a0a0b;border-radius:58px;display:flex;align-items:center;justify-content:center;padding:0 36px}
.logo img{mix-blend-mode:lighten;width:100%;display:block}
.wrap{position:absolute;left:40px;right:40px;top:180px;text-align:center}
.t1{font-size:120px}.t2{font-size:150px;margin-top:4px}
.hud{display:inline-block;margin-top:26px;font-size:36px;white-space:nowrap}
.c{position:absolute;bottom:-20px;height:760px}
.m{left:-40px}.s{right:-40px;transform:scaleX(1)}
.call{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-size:96px;z-index:3}
.fine{position:absolute;left:0;right:0;bottom:24px;text-align:center;z-index:3}.fine span{font-size:19px;padding:8px 14px;white-space:nowrap}
.badge{position:absolute;left:50%;transform:translateX(-50%) rotate(-4deg);bottom:390px;z-index:3;font-size:40px;white-space:nowrap}
</style></head><body><div class="shade"></div>
<div class="logo"><img src="../brand/logo_pill.jpg"></div>

<div class="gta-hud hud">Most iPhone screens fixed in ~15 min*</div></div>
<img class="c m" src="../characters/crew_marco.svg"><img class="c s" src="../characters/crew_sofia.svg">
<div class="gta-hud badge">+ FREE screen protector</div>
<div class="gta-mission call">380-271-8085</div>
<div class="fine"><span class="gta-hud">*Most iPhone screens &amp; batteries. Back glass &amp; other repairs may take longer, depend on parts.</span></div>
</body></html>
