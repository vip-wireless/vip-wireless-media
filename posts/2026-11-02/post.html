<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#f7f5f2;font-family:Inter,sans-serif;color:#141416;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);background-size:60px 60px}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(215,25,40,.16) 0%,rgba(215,25,40,0) 62%);left:-10px;top:300px}
.logo{position:absolute;left:56px;top:50px;height:124px;overflow:hidden;width:456px;background:#0a0a0b;border-radius:62px;padding:8px 8px 0 8px;box-shadow:0 12px 30px rgba(0,0,0,.16)}
.logo img{mix-blend-mode:lighten;height:204px;margin-top:-47px;margin-left:-28px}
.tag{position:absolute;right:64px;top:92px;font-size:22px;font-weight:600;letter-spacing:.14em;color:#6e6e76;text-transform:uppercase}
.kicker{position:absolute;left:64px;top:222px;background:#d71928;color:#fff;font-weight:800;font-size:26px;letter-spacing:.12em;padding:10px 18px;border-radius:6px;text-transform:uppercase}
h1{position:absolute;left:58px;top:288px;font-size:150px;line-height:.86;font-weight:900;letter-spacing:-.045em}
h1 span{color:#d71928}
.eq{position:absolute;left:64px;top:580px;font-size:36px;font-weight:800;line-height:1.25;width:470px}
.eq em{font-style:normal;color:#d71928}
.phones{position:absolute;right:16px;top:540px;width:480px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.25))}
.badge{position:absolute;right:60px;top:290px;width:210px;height:210px;border-radius:50%;background:#d71928;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(10deg);border:7px solid #f7f5f2;box-shadow:0 20px 50px rgba(215,25,40,.45)}
.badge b{font-size:62px;font-weight:900;line-height:1}
.badge small{font-size:21px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;line-height:1.15}
.call{position:absolute;left:64px;right:64px;top:965px;background:#0a0a0b;color:#fff;border-radius:28px;padding:30px 40px;display:flex;align-items:center;gap:30px;box-shadow:0 18px 40px rgba(0,0,0,.2)}
.call .ic{flex:none;width:96px;height:96px;border-radius:50%;background:#d71928;display:flex;align-items:center;justify-content:center}
.call p{font-size:28px;font-weight:700;color:#cfcfd4;letter-spacing:.04em;text-transform:uppercase}
.call .tel{font-size:84px;font-weight:900;letter-spacing:-.02em;line-height:1;margin-top:6px}
.foot{position:absolute;left:64px;right:64px;bottom:58px;display:flex;justify-content:space-between;align-items:flex-end}
.foot .addr{font-size:26px;color:#4a4a52;font-weight:600}
.foot .walk{font-size:26px;font-weight:800;color:#d71928;letter-spacing:.08em;text-transform:uppercase}
</style></head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="logo"><img src="../../_kit/brand/logo_wide.jpg"></div>
<div class="tag">Whitehall · Columbus</div>
<div class="kicker">Hey Columbus 👋</div>
<h1>FREE<br><span>PHONE.</span></h1>
<div class="eq">New activation<br>+ 3 months paid<br>= <em>a FREE phone</em> 📱</div>
<img class="phones" src="../../_kit/photos/offer_phones/free_phone_cutout_podium.png">
<div class="badge"><b>FREE</b><small>Phone<br>offer</small></div>
<div class="call">
  <div class="ic"><svg width="50" height="50" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.6a1 1 0 01-.25 1z"/></svg></div>
  <div><p>Call to claim yours</p><div class="tel">380-271-8085</div></div>
</div>
<div class="foot">
  <div class="addr">4257 E Main St, Whitehall (Columbus), OH</div>
  <div class="walk">Or walk in today</div>
</div>
</body></html>
