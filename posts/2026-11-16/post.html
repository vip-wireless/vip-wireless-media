<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:local("Inter")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#0a0a0b;font-family:Inter,sans-serif;color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(215,25,40,.38) 0%,rgba(215,25,40,0) 62%);left:-10px;top:330px}
.rays{position:absolute;left:540px;top:760px;width:1600px;height:1600px;margin:-800px 0 0 -800px;background:repeating-conic-gradient(rgba(255,255,255,.05) 0 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%)}
.logo{position:absolute;left:64px;top:56px;height:110px;overflow:hidden;width:440px}
.logo img{mix-blend-mode:lighten;height:204px;margin-top:-47px;margin-left:-28px}
.tag{position:absolute;right:64px;top:92px;font-size:22px;font-weight:600;letter-spacing:.14em;color:#bbb;text-transform:uppercase}
.head{position:absolute;left:0;right:0;top:196px;text-align:center}
.stop{display:inline-block;background:#d71928;color:#fff;font-weight:900;font-size:30px;letter-spacing:.14em;padding:12px 24px;border-radius:8px;text-transform:uppercase;transform:rotate(-2deg)}
h1{font-size:92px;line-height:.98;font-weight:900;letter-spacing:-.03em;margin-top:24px}
h1 span{color:#e01e2e}
.phones{position:absolute;left:230px;top:465px;width:590px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7)) drop-shadow(0 0 40px rgba(215,25,40,.35))}
.free{position:absolute;right:80px;top:500px;width:220px;height:220px;border-radius:50%;background:#d71928;border:6px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);box-shadow:0 20px 50px rgba(215,25,40,.55)}
.free b{font-size:64px;font-weight:900;line-height:.9;letter-spacing:-.02em}
.free small{font-size:22px;font-weight:800;letter-spacing:.1em;margin-top:6px}
.conf{position:absolute;width:16px;height:30px;border-radius:3px}
.eq{position:absolute;left:64px;right:64px;top:955px;display:flex;align-items:center;justify-content:center;gap:16px}
.card{background:#1a1a1e;border:2px solid rgba(255,255,255,.16);border-radius:18px;padding:18px 20px;text-align:center;width:250px}
.card .ic{font-size:40px}
.card p{font-size:27px;font-weight:800;line-height:1.12;margin-top:6px}
.op{font-size:58px;font-weight:900;color:#e01e2e}
.card.win{background:#d71928;border-color:#fff;width:250px}
.card.win p{font-size:34px}
.foot{position:absolute;left:64px;right:64px;bottom:56px;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid rgba(255,255,255,.12);padding-top:28px}
.foot .lbl{font-size:24px;font-weight:700;color:#e01e2e;letter-spacing:.1em;text-transform:uppercase}
.foot .tel{font-size:66px;font-weight:900;letter-spacing:-.01em;line-height:1.05}
.foot .addr{font-size:23px;color:#a9a9b0;margin-top:6px;font-weight:500}
.foot .walk{text-align:right;font-size:24px;font-weight:700;color:#fff;letter-spacing:.08em;text-transform:uppercase;line-height:1.5}
</style></head>
<body>
<div class="grid"></div><div class="glow"></div><div class="rays"></div>
<div class="logo"><img src="../../_kit/brand/logo_wide.jpg"></div>
<div class="tag">Whitehall · Columbus</div>

<div class="head">
  <div class="stop">🛑 Wait</div>
  <h1>Don't buy a phone<br>yet. <span>Get one FREE.</span></h1>
</div>

<img class="phones" src="../../_kit/photos/offer_phones/free_phone_cutout.png">
<div class="free"><b>FREE</b><small>PHONE</small></div>

<div class="conf" style="left:110px;top:560px;background:#d71928;transform:rotate(25deg)"></div>
<div class="conf" style="left:190px;top:470px;background:#fff;transform:rotate(-30deg)"></div>
<div class="conf" style="left:80px;top:760px;background:#fff;transform:rotate(60deg)"></div>
<div class="conf" style="left:960px;top:800px;background:#d71928;transform:rotate(-20deg)"></div>
<div class="conf" style="left:900px;top:470px;background:#fff;transform:rotate(40deg)"></div>
<div class="conf" style="left:300px;top:900px;background:#d71928;transform:rotate(-55deg)"></div>
<div class="conf" style="left:780px;top:880px;background:#fff;transform:rotate(15deg)"></div>

<div class="eq">
  <div class="card"><div class="ic">📶</div><p>New<br>activation</p></div>
  <div class="op">+</div>
  <div class="card"><div class="ic">🗓️</div><p>3 months<br>paid upfront</p></div>
  <div class="op">=</div>
  <div class="card win"><div class="ic">📱</div><p>FREE<br>PHONE</p></div>
</div>

<div class="foot">
  <div><div class="lbl">Call to claim yours</div><div class="tel">380-271-8085</div><div class="addr">4257 E Main St, Columbus (Whitehall), OH 43213</div></div>
  <div class="walk">Call, text<br>or walk in<br><span style="color:#a9a9b0;font-size:21px">Open daily 10:30–8</span></div>
</div>
</body></html>
