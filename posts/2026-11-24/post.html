<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/templates/gta_type.css"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{background:#000 url(../../_kit/photos/vice/vice_night1_1080x1920.jpg) center 55%/cover;font-family:Inter}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(10,2,20,.25) 34%,rgba(10,2,20,.35) 62%,rgba(0,0,0,.85))}
.vhs{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px);pointer-events:none;z-index:9}
.frame{position:absolute;inset:22px;border:4px solid #f5c542;border-radius:26px;box-shadow:0 0 28px rgba(255,46,147,.7),inset 0 0 28px rgba(46,242,224,.35);z-index:8;pointer-events:none}
.logo{position:absolute;left:330px;top:44px;height:100px;width:420px;overflow:hidden;background:#0a0a0b;border-radius:58px;display:flex;align-items:center;justify-content:center;padding:0 36px;z-index:5;box-shadow:0 0 0 4px #D71928}
.logo img{mix-blend-mode:lighten;width:100%;display:block}
.pin{position:absolute;left:52px;top:52px;z-index:5;width:86px;height:86px;border-radius:50%;background:rgba(0,0,0,.7);border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:44px}
.wanted{position:absolute;right:56px;top:66px;z-index:5;font-size:40px;color:#f5c542;-webkit-text-stroke:3px #000;paint-order:stroke fill;letter-spacing:2px}
.mission{position:absolute;left:0;right:0;top:176px;text-align:center;z-index:4}
.mission .gta-hud{font-size:32px;border-left-color:#2ef2e0}
.wrap{position:absolute;left:40px;right:40px;top:250px;text-align:center;z-index:4}
.t1{font-size:110px;color:#fff}
.t2{font-size:190px;margin-top:4px;transform:rotate(-3deg);display:inline-block}
.phones{position:absolute;left:50%;top:548px;width:560px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 0 40px rgba(46,242,224,.55)) drop-shadow(0 20px 30px rgba(0,0,0,.7))}
.glow{position:absolute;left:50%;top:640px;width:760px;height:420px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,46,147,.55),transparent 65%);z-index:2}
.badge{position:absolute;right:110px;top:590px;z-index:6;width:200px;height:200px;border-radius:50%;background:#D71928;border:7px solid #f5c542;display:flex;align-items:center;justify-content:center;transform:rotate(12deg);box-shadow:0 0 30px rgba(245,197,66,.8)}
.badge span{font-size:80px;color:#fff;-webkit-text-stroke:10px #000}
.eq{position:absolute;left:0;right:0;top:1022px;text-align:center;z-index:6}
.eq .gta-hud{display:inline-block;font-size:29px;white-space:nowrap;border-left-color:#ff2e93}
.eq .gta-hud b{color:#f5c542}
.foot{position:absolute;left:0;right:0;bottom:70px;text-align:center;z-index:6}
.call{font-size:110px}
.walk{display:inline-block;font-size:25px;margin-top:10px;white-space:nowrap;border-left-color:#D71928}
</style></head><body><div class="shade"></div><div class="glow"></div>
<div class="pin">📍</div>
<div class="logo"><img src="../../_kit/brand/logo_pill.jpg"></div>
<div class="wanted">★★★★★</div>
<div class="mission"><span class="gta-hud">New mission: score a free phone</span></div>
<div class="wrap"><div class="gta-title t1">Why pay for a</div><div class="gta-pink t2">Phone?</div></div>
<img class="phones" src="../../_kit/photos/offer_phones/free_phone_cutout.png">
<div class="badge"><span class="gta-mission">FREE</span></div>
<div class="eq"><span class="gta-hud">New activation + 3 months paid = <b>FREE PHONE</b></span></div>
<div class="foot"><div class="gta-mission call">380-271-8085</div><br><div class="gta-hud walk">Call to claim yours · or walk in · Whitehall</div></div>
<div class="frame"></div><div class="vhs"></div>
</body></html>
